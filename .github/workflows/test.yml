name: 'Test: Run Terraform Validation'

env:
  TERRAFORM_VERSION: '1.8.5'

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-format:
    name: Terraform Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Format Terraform files
        run: terraform fmt -recursive .

      - name: Commit formatted files
        if: github.event_name == 'pull_request'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "${{ github.head_ref }}" ]; then
            echo "::warning::Not on a pull request branch; skipping push"
            exit 0
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "style: format terraform files"
            
            # Fetch latest from remote and rebase
            git fetch origin ${{ github.head_ref }}
            git rebase origin/${{ github.head_ref }}
            
            git push origin HEAD:${{ github.head_ref }}
            echo "::notice::Terraform files formatted and committed"
          else
            echo "::notice::Terraform files are already properly formatted"
          fi

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialize Terraform
        run: |
          terraform init -backend=false
          echo "::notice::Terraform initialized (backend disabled)"

      - name: Validate Terraform configuration
        run: |
          terraform validate
          echo "::notice::Terraform configuration is valid"

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          MISSING=0
          
          for file in README.md main.tf variables.tf; do
            if [ -f "$file" ]; then
              echo "::notice::$file found"
            else
              echo "::error::$file is missing"
              MISSING=1
            fi
          done
          
          if [ -f "outputs.tf" ]; then
            echo "::notice::outputs.tf found"
          else
            echo "::warning::outputs.tf is missing (recommended)"
          fi
          
          if [ $MISSING -eq 1 ]; then
            exit 1
          fi

  summary:
    name: Test Summary
    needs: [terraform-format, terraform-validate, documentation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    
    steps:
      - name: Check test results
        run: |
          fmt="${{ needs.terraform-format.result }}"
          validate="${{ needs.terraform-validate.result }}"
          docs="${{ needs.documentation.result }}"

          failed=0

          if [ "$fmt" != "success" ]; then
            echo "::error::terraform fmt did not succeed (result: $fmt)"
            failed=1
          fi

          if [ "$validate" != "success" ]; then
            echo "::error::terraform validate did not succeed (result: $validate)"
            failed=1
          fi

          if [ "$docs" != "success" ]; then
            echo "::error::documentation check did not succeed (result: $docs)"
            failed=1
          fi

          if [ $failed -eq 1 ]; then
            exit 1
          else
            echo "::notice::All Terraform checks succeeded (fmt, validate, documentation)"
          fi
